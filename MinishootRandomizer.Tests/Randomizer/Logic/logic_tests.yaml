default_settings:
  shuffle_npcs: 'true'
  shuffle_scarabs: 'true'
  shuffle_xp_shards: 'true'
  shuffle_small_keys: 'true'
  shuffle_boss_keys: 'true'
  blocked_forest: 'true'
  ignore_cannon_level_requirements: 'false'
  boostless_springboards: 'false'
  boostless_spirit_races: 'false'
  boostless_torch_races: 'false'
  enable_primordial_crystal_logic: 'false'
  split_surf: 'false'
  progressive_dash: 'true'
  dashless_gaps: 'NeedsDash'
  completion_goals: 'Dungeon5'
default_item_counts:
  Progressive Cannon: 1
test_cases:
  - name: "Basic Sphere 0"
    tests:
      - location_accessibility:
          location_name: "Forest - Secret within Secret"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Town - Plaza"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Swamp - Hidden Before Big Enemy"
          expected_accessibility: "inaccessible"
  - name: "No Primordial Crystal, Logic Disabled"
    override_settings:
      enable_primordial_crystal_logic: 'false'
    add_items:
      Surf: 1
    tests:
      - region_accessibility:
          region_name: "Desert Grotto - East Drop"
          expected_accessibility: "inaccessible"
  - name: "Primordial Crystal, Logic Disabled"
    override_settings:
      enable_primordial_crystal_logic: 'false'
    add_items:
      Surf: 1
      Primordial Crystal: 1
    tests:
      - region_accessibility:
          region_name: "Desert Grotto - East Drop"
          expected_accessibility: "out_of_logic"
  - name: "Primordial Crystal, Logic Enabled"
    override_settings:
      enable_primordial_crystal_logic: 'true'
    add_items:
      Surf: 1
      Primordial Crystal: 1
    tests:
      - region_accessibility:
          region_name: "Desert Grotto - East Drop"
          expected_accessibility: "in_logic"
  - name: "Primordial Scarab Cave, without key & Supershot"
    add_items:
      Surf: 1
    tests:
      - location_accessibility:
          location_name: "Primordial Cave - Meet the Primordial Scarab"
          expected_accessibility: "inaccessible"
  - name: "Dungeon 3, with Split Surf, with both clean and void surf"
    override_settings:
      split_surf: 'true'
    add_items:
      Clean Surf: 1
      Void Surf: 1
    tests:
      - location_accessibility:
          location_name: "Dungeon 3 - Central Item"
          expected_accessibility: "in_logic"
  - name: "Dungeon 3, with Split Surf, without any surfs, using the turle"
    override_settings:
      split_surf: 'true'
    add_items:
      Progressive Cannon: 3
      Boost: 1
      Dash: 1
      Supershot: 1
    tests:
      - region_accessibility:
          region_name: "Dungeon 3 - Entrance"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Dungeon 3 - Central Item"
          expected_accessibility: "inaccessible"
  - name: "Dungeon 3, with Split Surf, without clean surf, using the turle"
    override_settings:
      split_surf: 'true'
    add_items:
      Progressive Cannon: 3
      Boost: 1
      Dash: 1
      Supershot: 1
      Void Surf: 1
    tests:
      - region_accessibility:
          region_name: "Dungeon 3 - Entrance"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Dungeon 3 - Central Item"
          expected_accessibility: "in_logic"
  - name: "Dungeon 3, with Split Surf, with clean surf and without void surf"
    override_settings:
      split_surf: 'true'
    add_items:
      Clean Surf: 1
    tests:
      - location_accessibility:
          location_name: "Dungeon 3 - Central Item"
          expected_accessibility: "inaccessible"
  - name: "Splitshot enabled, without blastshot"
    override_settings:
      split_shot: 'true'
    add_items:
      Flameshot: 1
    tests:
      - location_accessibility:
          location_name: "Zelda 1 Grotto - Behind the closed doors"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Forest - Secret pond behind bushes"
          expected_accessibility: "inaccessible"
      - region_accessibility:
          region_name: "Scarab Temple - Back"
          expected_accessibility: "inaccessible"
  - name: "Splitshot enabled, without flameshot"
    override_settings:
      split_shot: 'true'
    add_items:
      Blastshot: 1
    tests:
      - location_accessibility:
          location_name: "Zelda 1 Grotto - Behind the closed doors"
          expected_accessibility: "inaccessible"
      - location_accessibility:
          location_name: "Forest - Secret pond behind bushes"
          expected_accessibility: "in_logic"
      - region_accessibility:
          region_name: "Scarab Temple - Back"
          expected_accessibility: "inaccessible"
  - name: "Splitshot enabled, with both blastshot and flameshot"
    override_settings:
      split_shot: 'true'
    add_items:
      Blastshot: 1
      Flameshot: 1
    tests:
      - location_accessibility:
          location_name: "Zelda 1 Grotto - Behind the closed doors"
          expected_accessibility: "in_logic"
      - location_accessibility:
          location_name: "Forest - Secret pond behind bushes"
          expected_accessibility: "in_logic"
      - region_accessibility:
          region_name: "Scarab Temple - Back"
          expected_accessibility: "in_logic"
